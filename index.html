
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Blox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container"></div>

    <div id="hud">
        <div class="player-info">
            <h2>JUJUTSU BLOX</h2>
            <p>LEVEL <span id="level">1</span></p>
        </div>

        <div class="bars">
            <div class="bar health">
                <div id="health-fill"></div>
            </div>
            <div class="bar energy">
                <div id="energy-fill"></div>
            </div>
        </div>

        <div id="stats">
            <span>HP: 100 / 100</span>
            <span>CE: 100 / 100</span>
        </div>
    </div>

    <div id="loading">
        <h1>JUJUTSU BLOX</h1>
        <p>THE CURSED WORLD AWAITS</p>
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
